[project]
# FIXME: change this
name = "deep-learning-intro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jupytext>=1.18.1",
  "myst-nb>=1.3.0",
  "sphinx<9",
  # "sphinx-evita>=0.1.0b1",
  "sphinx-evita @ https://github.com/ENCCS/sphinx-evita/archive/8f8a07dac2f7c667b81f74a181751990e6edb15e.zip",
  # "sphinx-lesson>=0.8.19",
  # To avoid sphinx<8 restriction from sphinx-lesson and self-imposed sphinx>8.2 something restriction from sphinx-evita
  "sphinx-lesson>=0.8.20",
  "sphinxcontrib-bibtex>=2.6.5",
  "sphinxcontrib-mermaid>=2.0.0",
]

[dependency-groups]
dev = [
  { include-group = "notebook" },
  "jupyterlab>=4.4.6",
  "jupyterlab-myst>=2.4.2",
]
# All dependencies used within Jupyter Notebooks
notebook = [
  "jupyter",
  "seaborn",
  "scikit-learn",
  "pandas",
  # "tensorflow",
  "pydot",
  "keras",
  "seaborn",
  "torch>=2.10.0",
  "torchvision>=0.25.0",
  "torchinfo>=1.8.0",
  "tensorboard>=2.20.0",
  "torchmetrics>=1.8.2",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false
